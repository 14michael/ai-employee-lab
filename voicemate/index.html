<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171226"><title>聲伴 VoiceMate V0.2.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#f5f0ff;background:#13101d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#47315a,#13101d 55%);min-height:100vh}main{max-width:780px;margin:auto;padding:22px 15px 35px}h1{margin:0;font-size:29px}h2{font-size:16px;margin:0 0 13px}p{color:#c9bfd9;line-height:1.5}small{color:#afa4bf}.sub{margin:5px 0 20px}.card{background:#231d32;border:1px solid #4d405e;border-radius:20px;padding:18px;margin-bottom:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{display:flex;flex-direction:column;gap:8px;border:1px solid #554562;background:#30263e;color:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer}.option.on{border-color:#ce9aff;background:#49345e;box-shadow:0 0 0 2px #9462b7 inset}.emoji{font-size:28px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#aa70e0;color:#180b24;font-weight:700;cursor:pointer;min-height:46px}.btn.secondary{background:#41354e;color:#f8efff;border:1px solid #665777}.btn:disabled{opacity:.5}select,input{background:#1a1427;color:white;border:1px solid #75638b;border-radius:11px;padding:13px;min-height:46px;font-size:16px;max-width:100%}select{width:100%}#chat{height:310px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.bubble{padding:12px 14px;border-radius:14px;line-height:1.5;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;background:#362946;align-self:flex-start}.bubble.me{align-self:flex-end;background:#68428c}.who{font-size:11px;color:#dfc0fb;margin-bottom:5px}.compose{display:flex;gap:8px;margin-top:12px}.compose input{flex:1;min-width:0}.hint{padding:12px;border-radius:12px;background:#1b1727;color:#e1c8fa;font-size:13px;line-height:1.6}.status{font-size:12px;color:#c9b3e4;min-height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;gap:9px;align-items:center;font-size:14px;color:#ddd0e8;margin:14px 0}.check input{min-height:auto}.tag{border:1px solid #76608b;border-radius:99px;padding:5px 10px;color:#dec8f5;font-size:12px}@media(max-width:420px){main{padding:15px 11px}h1{font-size:25px}.card{padding:14px}.option{padding:12px}.btn{padding:11px}#chat{height:280px}}</style></head>
<body><main><header><div class="row"><h1>🎧 聲伴 VoiceMate</h1><span class="tag">V0.2.0 修正版</span></div><p class="sub">找個喜歡的聲音，聊聊今天的心情。</p></header>
<section class="card"><h2>① 選擇喜歡的聲音</h2><div class="grid"><button class="option" id="male" type="button"><span class="emoji">👨</span><strong>男聲</strong><small>沉穩、舒服</small></button><button class="option on" id="female" type="button"><span class="emoji">👩</span><strong>女聲</strong><small>溫柔、自然</small></button></div><p><small>新增台灣華語男女聲線的外部錄製樣本，可直接試聽；目前尚非即時朗讀引擎，正式使用須確認音檔授權與雲端語音服務。</small></p><select id="voice" aria-label="語音聲線"><option>正在載入裝置聲線...</option></select><div class="row" style="margin-top:12px"><button class="btn secondary" id="preview">▶ 試聽聲音</button><button class="btn secondary" id="reload">↻ 重新偵測聲線</button></div></section>
<section class="card"><h2>② 選擇聊天個性</h2><div class="grid" id="personalities"><button type="button" class="option on" data-tone="warm">💗 溫柔陪伴</button><button type="button" class="option" data-tone="fun">😄 幽默搞笑</button><button type="button" class="option" data-tone="smart">🧠 成熟知性</button><button type="button" class="option" data-tone="roast">🌶️ 毒舌損友</button><button type="button" class="option" data-tone="flirt">🌹 甜言蜜語</button></div></section>
<section class="card"><h2>③ 開始聊天</h2><div class="hint"><b>目前尚未完成「您說話 → AI 理解 → 用選定男女聲回答」功能。</b>現在僅是預設規則對話；外部男／女聲音檔只能試聽，不能唸出新回覆。iPhone 內建網頁或 LINE 瀏覽器可能中止收音。正式產品需接上語音辨識、AI 後端及動態語音合成。</div><div id="chat" role="log" aria-live="polite"></div><div class="compose"><input id="msg" placeholder="輸入想聊的話…" aria-label="聊天訊息"><button class="btn" id="send">送出</button></div><label class="check"><input type="checkbox" id="auto" checked>自動朗讀回覆</label><div class="actions"><button type="button" class="btn secondary" id="mic">🎙 開始說話</button><button type="button" class="btn secondary" id="stop">■ 停止</button><button type="button" class="btn secondary" id="clear">清除對話</button></div><p id="status" class="status" role="status"></p></section>
<footer><small>VoiceMate V0.2.0｜情境互動測試。請勿輸入機敏資料。沒有雲端帳號或跨裝置聊天記憶。</small></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),synth=window.speechSynthesis,Rec=window.SpeechRecognition||window.webkitSpeechRecognition;let gender='female',tone='warm',voices=[],recognizer=null;const status=s=>$('status').textContent=s;const chooseGender=g=>{gender=g;['male','female'].forEach(k=>$(k).classList.toggle('on',k===g));populate()};$('male').onclick=()=>chooseGender('male');$('female').onclick=()=>chooseGender('female');document.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>{tone=b.dataset.tone;document.querySelectorAll('[data-tone]').forEach(x=>x.classList.toggle('on',x===b));status('已切換聊天個性')});function voiceGender(v){let n=v.name.toLowerCase();if(/美佳|婷婷|曉曉|小美|huihui|ting-ting|mei-jia|samantha|victoria|karen|serena|susan|zira|female|女聲|女声|woman|siri female/.test(n))return 'female';if(/俊男|男聲|男声|male|man|daniel|aaron|alex|fred|rishi|reed|rocko|jun|yunjian|yunxi|yunyang/.test(n))return 'male';return 'unknown'}const demoVoices={male:{name:'雲哲｜台灣華語男聲 · 線上試聽樣本',url:'https://raw.githubusercontent.com/zzhang7731-wq/voice-library/main/zh/male/zh-TW-YunJheNeural.mp3'},female:{name:'曉臻｜台灣華語女聲 · 線上試聽樣本',url:'https://raw.githubusercontent.com/zzhang7731-wq/voice-library/main/zh/female/zh-TW-HsiaoChenNeural.mp3'}};let samplePlayer=null;function playSample(){if(samplePlayer){samplePlayer.pause();samplePlayer=null}const demo=demoVoices[gender];samplePlayer=new Audio(demo.url);samplePlayer.onplaying=()=>status('正在播放'+demo.name+'；此為預錄試聽，不是即時語音合成');samplePlayer.onerror=()=>status('試聽音檔無法載入，請檢查網路或外部音檔服務');const p=samplePlayer.play();if(p&&p.catch)p.catch(e=>status('播放受瀏覽器限制：'+e.message));}function populate(){voices=synth?synth.getVoices():[];let select=$('voice');select.replaceChildren();let chinese=voices.filter(v=>/zh|cmn/i.test(v.lang));let pool=chinese.length?chinese:voices;let classified=pool.filter(v=>voiceGender(v)===gender);let found=classified;let sample=document.createElement('option');sample.value='demo';sample.textContent=demoVoices[gender].name;select.append(sample);found.forEach(v=>{let o=document.createElement('option');o.value=String(voices.indexOf(v));o.textContent=v.name+' ('+v.lang+')'+(voiceGender(v)===gender?' · 疑似'+(gender==='male'?'男':'女')+'聲':'');select.append(o)});if(!found.length){$('preview').disabled=false;status('可試聽'+(gender==='male'?'男':'女')+'聲錄製樣本；但裝置沒有可用的相應聲線，聊天回覆無法用這個音色即時朗讀。');}else{$('preview').disabled=false;status('偵測到 '+classified.length+' 個可能符合偏好的聲線，請點「試聽聲音」確認。');}}if(synth){populate();synth.onvoiceschanged=populate}function speak(t){if($('voice').value==='demo'){status('⛔ 所選的男／女聲是試聽錄音，無法用它念出聊天回覆。尚未串接動態 TTS。');return}if(!synth){status('此瀏覽器未支援語音朗讀');return}if(!$('voice').value){status('沒有符合聲線，無法朗讀；請改選可辨識的聲音');return}try{synth.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.96;let i=Number($('voice').value);if(voices[i])u.voice=voices[i];u.pitch=1;synth.speak(u)}catch(e){status('語音播放失敗：'+e.message)}}$('preview').onclick=()=>$('voice').value==='demo'?playSample():speak('你好，今天過得怎麼樣？我是聲伴，很高興陪你聊聊天。');$('reload').onclick=populate;function add(who,msg,me=false){let d=document.createElement('div');d.className='bubble'+(me?' me':'');let label=document.createElement('div');label.className='who';label.textContent=who;let body=document.createElement('div');body.textContent=msg;d.append(label,body);$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight}const replies={
warm:['我在這裡聽你說。今天有什麼事情特別想分享嗎？','聽起來你想找個人聊聊。慢慢說，我在。','謝謝你願意分享。你現在最在意的是什麼？'],
fun:['這故事有點精彩耶！接下來是不是還有反轉？','哈哈，這題如果拍成電影，片名我都想好了！','好啦，我先把笑點收起來。然後呢？'],
smart:['我們可以先釐清你最想解決的問題，再看看有哪些選擇。','有意思。你覺得這件事情最重要的關鍵是什麼？','不一定要急著下結論，先看看不同角度。'],
roast:['哎唷，終於想到找我聊天啦？我還以為你在跟待辦清單談戀愛。','你這個想法很有創意，但先不要一秒變成十四個新專案好嗎？','欸，這句話值得吐槽，但先說說後來怎樣啦！'],
flirt:['今天的訊息裡，我最喜歡的就是你願意多說幾句。你現在想聊什麼？','你一開口，平凡的話題都多了一點甜。說說看，我可以怎麼接住你的好心情？','我不一定猜得到你的心思，但很願意認真聽你講。今天想被逗笑，還是想被稱讚？']
};let count=0;
function reply(t){
if(tone==='flirt'){
if(/不要|別這樣|停止|太油|不舒服|不喜歡/.test(t))return '收到，我把甜度調低一點。你想輕鬆聊什麼？';
if(/你好|嗨|哈囉/.test(t))return '嗨，今天你一出現，聊天氣氛就變好了。想讓我說句甜話，還是先聽你分享？';
if(/想你|喜歡你|愛你/.test(t))return '這句話很甜，差點讓我的回覆都打結了。你喜歡直球告白，還是含蓄一點的浪漫？';
if(/你會回話嗎|你會聊天嗎|會回嗎|是機器人|真的假的/.test(t))return '會呀，至少現在我能認真接住你這句話。這裡還是情境試用版，真正自由對話得等 AI 連線完成。你想試試哪種聊天風格？';
if(/累|難過|孤單|寂寞|煩|壓力/.test(t))return '那今天先別勉強自己表現得很堅強。我送你一句溫柔的話：辛苦的你，也值得被好好對待。願意說說發生什麼事嗎？';
if(/漂亮|帥|好看|稱讚/.test(t))return '我還沒見過你，不會亂誇外表；不過願意把心裡話說出來，這份坦率就很有魅力。';
if(/晚安|睡覺/.test(t))return '晚安。願你今晚把煩惱留在門外，帶著一點甜甜的心情去休息。';
return replies.flirt[count++%replies.flirt.length]
}
if(/你好|嗨|哈囉/.test(t))return {warm:'嗨，見到你真好。今天想聊點什麼？',fun:'哈囉！今天要聊八卦、趣事還是人生大事？',smart:'你好。今天有什麼值得一起聊聊的事？',roast:'哇，你終於出現了，我還以為你被工作綁架。'}[tone];
if(/難過|不開心|壓力|累了|煩/.test(t))return '聽起來這件事讓你不太舒服。你願意多跟我說一點嗎？';
return replies[tone][count++%3]
}function send(){let t=$('msg').value.trim();if(!t)return;$('msg').value='';add('你',t,true);let r=reply(t);add('聲伴 · 情境回覆（非AI）',r);status('⚠ 這是離線預設台詞，尚未接上 AI 聊天後端。');if($('auto').checked){if($('voice').value==='demo')status('⚠ 已回覆文字，但「預錄聲線」無法唸出新句子。真正語音回答尚未完成。');else speak(r)}}
$('send').onclick=send;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function stop(){if(recognizer){try{recognizer.abort()}catch(e){}recognizer=null}if(synth)synth.cancel();if(samplePlayer){samplePlayer.pause();samplePlayer=null}$('mic').textContent='🎙 開始說話';status('已停止語音')}
$('stop').onclick=stop;
$('clear').onclick=()=>{stop();$('chat').replaceChildren();add('聲伴','對話已清除。今天想從什麼話題聊起？')};
$('mic').onclick=()=>{
if(recognizer){stop();return}
if(!Rec){status('⛔ 目前瀏覽器不支援語音辨識。請用 Safari 開啟正式網址，或用 iPhone 鍵盤麥克風輸入。');return}
try{
if(synth){synth.cancel()}if(samplePlayer){samplePlayer.pause();samplePlayer=null}
let r=new Rec();recognizer=r;r.lang='zh-TW';r.continuous=false;r.interimResults=false;let gotText=false;let manuallyStopped=false;
r.onstart=()=>{$('mic').textContent='■ 停止收音';status('正在聆聽，請說一句話…')};
r.onresult=e=>{gotText=true;const t=e.results[0][0].transcript;$('msg').value=t;status('已辨識：「'+t+'」');send()};
r.onerror=e=>{if(e.error==='aborted'){status('⚠ 語音收音遭瀏覽器中止（aborted）。請於 iPhone Safari 開啟；LINE 內建瀏覽器可能無法正常啟動。')}else if(e.error==='not-allowed'||e.error==='service-not-allowed'){status('⚠ 麥克風權限被拒絕或語音服務未授權，請開啟 Safari 麥克風權限。')}else{status('⚠ 語音辨識失敗：'+e.error+'。可改用鍵盤麥克風輸入。')}};
r.onend=()=>{recognizer=null;$('mic').textContent='🎙 開始說話';if(!gotText&&!$('status').textContent.includes('失敗')&&!$('status').textContent.includes('中止')&&!$('status').textContent.includes('權限')){status('未取得語音文字，請再試一次或用鍵盤麥克風。')}};
r.start()
}catch(e){status('⚠ 麥克風啟動失敗：'+e.message+'。請使用 Safari 或鍵盤麥克風。')}
};
add('聲伴','嗨！先挑喜歡的聲音，再跟我說說今天過得怎麼樣吧。')})();
</script></body></html>
