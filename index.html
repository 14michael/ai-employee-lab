<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Employee Lab V1.1</title><style>body{margin:0;background:#f5f3ed;color:#28313b;font:16px system-ui,"Microsoft JhengHei",sans-serif}header{background:#203246;color:#fff;padding:28px 5vw}main{max-width:1080px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #e1e4e8;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;margin:7px 0 12px;padding:10px;border:1px solid #bec8d1;border-radius:8px;font:inherit}button{border:0;background:#235c88;color:white;padding:10px 14px;border-radius:8px;margin:4px;cursor:pointer}button.alt{background:#596b7a}button.danger{background:#a34242}small{color:#6a7683}.task{border-top:1px solid #ddd;padding:12px 0}.light{font-size:28px}.notice{background:#fff2d9;border-left:4px solid #cb9339;padding:14px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.pill{background:#e8f1f8;padding:4px 8px;border-radius:20px}h1{margin:4px 0}h2{font-size:21px}</style></head><body><header><small style="color:#bcd3e4">AI EMPLOYEE LAB · V1.1 · LOCAL FIRST</small><h1>AI 員工工作中心</h1><p>角色管理・任務派工・人工審核・狀態看板・總 PM 週報</p></header><main><div class="notice"><b>能力揭露：</b>此版本是人工操作的本機任務管理系統，尚未連接 Claude、Codex 或 Grok，燈號不是即時 Agent 執行結果。資料保存在此瀏覽器，請定期匯出備份。</div><section class="grid" id="stats"></section><section class="card"><button id="report">產生總 PM 週報</button><button id="export">匯出 JSON 備份</button><button id="import" class="alt">匯入備份</button><input type="file" id="file" accept=".json,application/json" hidden><button id="reset" class="danger">清除資料</button></section><section class="grid"><div class="card"><h2>建立 AI 員工</h2><label>名稱<input id="name" placeholder="例如：研究員"></label><label>主要職責<textarea id="role"></textarea></label><label>人工核准規則<textarea id="gate"></textarea></label><button id="addAgent">建立員工</button></div><div class="card"><h2>建立工作任務</h2><label>指派對象<select id="assignee"></select></label><label>任務名稱<input id="title"></label><label>工作指令<textarea id="brief"></textarea></label><button id="addTask">建立任務</button></div></section><section class="card"><h2>虛擬辦公室｜狀態看板</h2><div class="grid" id="office"></div></section><section class="card"><h2>任務與審核</h2><select id="filter"><option>全部</option><option>待辦</option><option>工作中</option><option>等待核准</option><option>完成</option><option>失敗</option></select><div id="tasks"></div></section><section class="card"><h2>總 PM 週報</h2><pre id="weekly">請點選「產生總 PM 週報」。</pre><button id="copy">複製週報</button></section><section class="card"><h2>稽核紀錄</h2><div id="events"></div></section></main><script>
"use strict";
const KEY="ai-employee-lab-v1-1";const $=x=>document.getElementById(x);const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const stamp=()=>new Date().toISOString();const initial=()=>({agents:[["Eve","總 PM、整合工作進度","交付須人工核准"],["Joseph","財務研究","交易須人工核准"],["Luke","健康資料整理","醫療決策須人工確認"],["Solomon","學習研究","公開內容須人工確認"],["Nehemiah","行政營運","正式決策須人工核准"],["Paul","個人品牌","發布須人工核准"]].map((x,i)=>({id:"a"+i,name:x[0],role:x[1],gate:x[2]})),tasks:[],events:[]});const valid=d=>d&&Array.isArray(d.agents)&&Array.isArray(d.tasks)&&Array.isArray(d.events);let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!valid(db))db=initial()}catch{db=initial()}
function el(tag,txt){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n}
function log(msg){db.events.unshift({at:stamp(),msg});db.events=db.events.slice(0,500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("無法儲存，請先匯出資料")}render()}
function action(where,label,fn,cls){let b=el("button",label);if(cls)b.className=cls;b.onclick=fn;where.append(b)}
function change(t,s,ev){ev=ev.trim();if(["等待核准","完成"].includes(s)&&!ev)return alert("請先填入成果或證據");if(s==="完成"&&!confirm("確認已人工檢查成果並核准完成？"))return;t.status=s;t.evidence=ev;t.updatedAt=stamp();if(s==="完成")t.approvedAt=stamp();log(t.title+" → "+s);save()}
function render(){let statuses=["待辦","工作中","等待核准","完成","失敗"];$("stats").replaceChildren();for(let s of statuses){let c=el("div");c.className="card";c.append(el("small",s),el("h2",String(db.tasks.filter(t=>t.status===s).length)));$("stats").append(c)}let prev=$("assignee").value;$("assignee").replaceChildren();for(let a of db.agents){let o=el("option",a.name);o.value=a.id;$("assignee").append(o)}if(db.agents.some(a=>a.id===prev))$("assignee").value=prev;$("office").replaceChildren();for(let a of db.agents){let ts=db.tasks.filter(t=>t.agentId===a.id);let state=ts.some(t=>t.status==="失敗")?"失敗":ts.some(t=>t.status==="等待核准")?"待核准":ts.some(t=>t.status==="工作中")?"工作中":ts.some(t=>t.status==="待辦")?"待辦":"閒置";let c=el("div");c.className="card";c.append(el("div",({失敗:"🔴",待核准:"🟠",工作中:"🟢",待辦:"🔵",閒置:"⚪"})[state]));c.append(el("h3",a.name),el("p",state+"｜"+ts.length+" 項任務"),el("small",a.role+"／"+a.gate));$("office").append(c)}$("tasks").replaceChildren();let list=db.tasks.filter(t=>$("filter").value==="全部"||t.status===$("filter").value);if(!list.length)$("tasks").append(el("p","目前沒有符合條件的任務"));for(let t of list){let c=el("div");c.className="task";let a=db.agents.find(a=>a.id===t.agentId);c.append(el("h3",t.title),el("small",(a?.name||"未知")+"｜"+t.status),el("p",t.brief));let area=el("textarea");area.value=t.evidence||"";area.placeholder="成果、證據或檔案路徑（不得虛構）";c.append(area);if(t.status==="待辦")action(c,"開始工作",()=>change(t,"工作中",area.value));if(t.status==="工作中"){action(c,"提交審核",()=>change(t,"等待核准",area.value));action(c,"標記失敗",()=>change(t,"失敗",area.value),"danger")}if(t.status==="等待核准"){action(c,"人工核准完成",()=>change(t,"完成",area.value));action(c,"退回修改",()=>change(t,"工作中",area.value),"alt")}if(t.status==="失敗")action(c,"重新開始",()=>change(t,"工作中",area.value));action(c,"儲存證據",()=>{t.evidence=area.value.trim();log("更新證據："+t.title);save()},"alt");$("tasks").append(c)}$("events").replaceChildren();for(let e of db.events.slice(0,80))$("events").append(el("p",new Date(e.at).toLocaleString("zh-TW")+"｜"+e.msg))}
$("addAgent").onclick=()=>{let name=$("name").value.trim(),role=$("role").value.trim(),gate=$("gate").value.trim();if(!name||!role||!gate)return alert("請填寫全部欄位");let a={id:id(),name,role,gate};db.agents.push(a);log("建立員工："+name);["name","role","gate"].forEach(x=>$(x).value="");save()};
$("addTask").onclick=()=>{let title=$("title").value.trim(),brief=$("brief").value.trim(),agentId=$("assignee").value;if(!title||!brief||!agentId)return alert("請填寫任務、指令與指派對象");db.tasks.push({id:id(),title,brief,agentId,status:"待辦",evidence:"",createdAt:stamp()});log("建立任務："+title);$("title").value="";$("brief").value="";save()};
$("filter").onchange=render;
$("report").onclick=()=>{let lines=["AI Employee Lab｜總 PM 週報","產生時間："+new Date().toLocaleString("zh-TW"),"資料來源：本機人工更新紀錄（非 AI 自動回報）",""];for(let s of ["待辦","工作中","等待核准","完成","失敗"])lines.push(s+"："+db.tasks.filter(t=>t.status===s).length);for(let a of db.agents)lines.push("【"+a.name+"】"+(db.tasks.filter(t=>t.agentId===a.id).map(t=>t.title+"（"+t.status+"）").join("；")||"無任務"));$("weekly").textContent=lines.join("\n")};
$("copy").onclick=()=>{navigator.clipboard?.writeText($("weekly").textContent).then(()=>alert("已複製")).catch(()=>alert("請手動複製週報"))};
$("export").onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"})),a=el("a");a.href=u;a.download="ai-employee-lab-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!valid(d))throw Error("格式錯誤");if(confirm("以備份取代目前資料？")){db=d;log("匯入備份");save()}}catch(err){alert("匯入失敗："+err.message)}e.target.value=""};
$("reset").onclick=()=>{if(confirm("確定清除全部資料？請先匯出備份。")){db={agents:[],tasks:[],events:[]};save()}};render();
</script></body></html>
